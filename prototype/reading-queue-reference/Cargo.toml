[workspace]
members = [
  "crates/server",
  "crates/transport-http",
  "crates/application",
  "crates/domain",
  "crates/persistence-postgres",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "=5.5.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "=0.2.0"
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["serde", "v7"] }
