[workspace]
members = ["crates/yydra-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
version = "0.0.3"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
hex = "=0.4.3"
include_dir = "=0.7.4"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
