# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
members = ["crates/yydra-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
hex = "=0.4.3"
include_dir = "=0.7.4"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
spdx = "=0.13.5"
tempfile = "=3.27.0"
toml = "=1.1.4"
