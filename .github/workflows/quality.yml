# SPDX-License-Identifier: MIT OR Apache-2.0
name: Yydra CLI CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Build and test yydra-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install rolling Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy
      - name: Build yydra-cli
        run: cargo build --locked --release --package yydra-cli
      - name: Test yydra-cli
        run: cargo test --locked --package yydra-cli --all-targets
