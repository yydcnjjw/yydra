# SPDX-License-Identifier: MIT OR Apache-2.0
name: Yydra CLI CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Build and test yydra-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install rolling Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy
      - name: Install pinned moon
        run: |
          python3 scripts/install-moon.py "$RUNNER_TEMP/moon"
          echo "$RUNNER_TEMP/moon" >> "$GITHUB_PATH"
      - name: Build yydra-cli
        run: moon run repo:ci-build
      - name: Test yydra-cli
        run: moon run repo:test
