# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yydra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Exact-version CLI for the Yydra application framework"
repository = "https://github.com/yydcnjjw/yydra"
readme = "README.md"
include = [
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "src/**",
  "tests/consumer_creation.rs",
  "tests/container_deployment.rs",
  "tests/api_generation.rs",
  "tests/build.rs",
  "tests/check_contract.rs",
  "tests/live_workspace.rs",
  "tests/packaged_consumer.rs",
  "/template/product-workspace/**",
  "README.md",
  "third-party/**",
]

[[bin]]
name = "yydra"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
hex.workspace = true
include_dir.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
spdx.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
