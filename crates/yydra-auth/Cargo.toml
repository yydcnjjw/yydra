# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yydra-auth"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GitHub authentication and product sessions for Yydra"
repository = "https://github.com/yydcnjjw/yydra"
readme = "README.md"
include = ["src/**", "migrations/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# Explicitly enabled only by controlled integration fixtures.
test-provider = []

[dependencies]
axum = "=0.8.9"
axum-login = "=0.18.0"
base64 = "=0.22.1"
oauth2 = "=5.0.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["derive", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "time"] }
time = { version = "=0.3.55", features = ["formatting"] }
tower-sessions = "=0.14.0"
tower-sessions-sqlx-store = { version = "=0.15.0", default-features = false, features = ["postgres"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
utoipa = "=5.5.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
