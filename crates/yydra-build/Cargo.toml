# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yydra-build"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Public API and generated-client build support for Yydra Product Workspaces"
repository = "https://github.com/yydcnjjw/yydra"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anyhow = "=1.0.104"
hex = "=0.4.3"
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"
