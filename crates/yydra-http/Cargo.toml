# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yydra-http"
version = "0.6.0-dev.1"
publish = ["yydra-local"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Problem responses and request diagnostics for Yydra HTTP adapters"
repository = "https://github.com/yydcnjjw/yydra"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
axum = "=0.8.9"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
snafu = "=0.9.2"
tokio = { version = "=1.53.1", features = ["rt"] }
tracing = "=0.1.44"
utoipa = "=5.5.0"

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
