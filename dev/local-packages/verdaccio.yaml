storage: /verdaccio/storage
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 1
uplinks: {}
packages:
  '@yydra/*':
    access: $all
    publish: yydra
    unpublish: []
  '**':
    access: []
    publish: []
    unpublish: []
log: { type: stdout, format: pretty, level: warn }
